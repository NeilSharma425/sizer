<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Lucky; src: url(luckiest.woff2) format("woff2"); }
@font-face { font-family: Fred; src: url(fredoka.woff2) format("woff2"); font-weight: 700; }
html, body { margin: 0; padding: 0; width: 1920px; height: 1080px; overflow: hidden; background: #4fb3ff; }
svg { display: block; }
.title { font-family: Lucky; }
.lab { font-family: Fred; font-weight: 700; }
</style></head>
<body>
<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e8cff"/><stop offset="0.65" stop-color="#7cc8ff"/><stop offset="1" stop-color="#c9ecff"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/><stop offset="0.35" stop-color="#fff6c8" stop-opacity="0.6"/><stop offset="1" stop-color="#fff6c8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fd16a"/><stop offset="1" stop-color="#4caa3e"/>
    </linearGradient>
    <radialGradient id="duckBody" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#fff59a"/><stop offset="0.45" stop-color="#ffd92e"/><stop offset="1" stop-color="#f0a800"/>
    </radialGradient>
    <radialGradient id="duckHead" cx="0.4" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#fff7a8"/><stop offset="0.5" stop-color="#ffdb33"/><stop offset="1" stop-color="#eea300"/>
    </radialGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffa63d"/><stop offset="1" stop-color="#ff6a00"/>
    </linearGradient>
    <linearGradient id="titleFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff36b"/><stop offset="0.55" stop-color="#ffc21a"/><stop offset="1" stop-color="#ff8a00"/>
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3bd16f"/><stop offset="0.5" stop-color="#ffd23f"/><stop offset="1" stop-color="#ff4d6d"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#0b2a55" flood-opacity="0.45"/></filter>
    <pattern id="tiles" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="#ffffff" opacity="0.0"/>
      <rect width="60" height="60" fill="#ffffff" opacity="0.10"/><rect x="60" y="60" width="60" height="60" fill="#ffffff" opacity="0.10"/>
    </pattern>
  </defs>

  <!-- sky, sun, clouds -->
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <circle cx="1580" cy="170" r="260" fill="url(#sun)"/>
  <g fill="#ffffff" opacity="0.95">
    <g transform="translate(150,330)"><ellipse cx="0" cy="0" rx="120" ry="55"/><ellipse cx="80" cy="-35" rx="90" ry="65"/><ellipse cx="170" cy="0" rx="110" ry="50"/></g>
    <g transform="translate(1500,460)"><ellipse cx="0" cy="0" rx="150" ry="60"/><ellipse cx="100" cy="-45" rx="110" ry="75"/><ellipse cx="210" cy="0" rx="120" ry="55"/></g>
    <g transform="translate(1180,250) scale(0.7)"><ellipse cx="0" cy="0" rx="120" ry="55"/><ellipse cx="80" cy="-35" rx="90" ry="65"/><ellipse cx="170" cy="0" rx="110" ry="50"/></g>
  </g>

  <!-- ground with checker tiles, in perspective -->
  <g>
    <path d="M0 820 L1920 820 L1920 1080 L0 1080 Z" fill="url(#floor)"/>
    <g transform="translate(960,820) scale(1,0.32) translate(-960,0)">
      <rect x="-1200" y="0" width="4320" height="900" fill="url(#tiles)"/>
    </g>
    <rect x="0" y="815" width="1920" height="10" fill="#3f9a33" opacity="0.5"/>
  </g>

  <!-- shadows on the ground -->
  <ellipse cx="840" cy="845" rx="430" ry="48" fill="#1f5a19" opacity="0.35" filter="url(#soft)"/>
  <ellipse cx="1500" cy="848" rx="85" ry="16" fill="#1f5a19" opacity="0.4" filter="url(#soft)"/>

  <!-- GIANT RUBBER DUCK -->
  <g filter="url(#drop)">
    <!-- tail -->
    <path d="M1150 520 Q1265 420 1250 560 Q1230 650 1130 640 Z" fill="url(#duckBody)" stroke="#5a3a00" stroke-width="10" stroke-linejoin="round"/>
    <!-- body -->
    <ellipse cx="860" cy="660" rx="380" ry="200" fill="url(#duckBody)" stroke="#5a3a00" stroke-width="10"/>
    <!-- wing -->
    <path d="M880 600 Q1060 560 1110 650 Q1040 740 890 700 Q840 650 880 600 Z" fill="#ffc81f" stroke="#5a3a00" stroke-width="8" stroke-linejoin="round"/>
    <path d="M930 640 Q1010 630 1060 660" fill="none" stroke="#e39d00" stroke-width="8" stroke-linecap="round"/>
    <!-- head -->
    <circle cx="640" cy="360" r="200" fill="url(#duckHead)" stroke="#5a3a00" stroke-width="10"/>
    <!-- beak -->
    <path d="M470 380 Q370 360 345 410 Q370 450 470 445 Q500 415 470 380 Z" fill="url(#beak)" stroke="#5a3a00" stroke-width="9" stroke-linejoin="round"/>
    <path d="M352 412 Q410 420 470 415" fill="none" stroke="#b84700" stroke-width="6" stroke-linecap="round"/>
    <!-- eye -->
    <ellipse cx="575" cy="315" rx="38" ry="48" fill="#ffffff" stroke="#5a3a00" stroke-width="7"/>
    <ellipse cx="565" cy="322" rx="22" ry="30" fill="#1b1430"/>
    <circle cx="556" cy="309" r="9" fill="#ffffff"/>
    <!-- shine -->
    <ellipse cx="700" cy="260" rx="55" ry="28" fill="#ffffff" opacity="0.55" transform="rotate(-25 700 260)"/>
    <ellipse cx="720" cy="590" rx="110" ry="26" fill="#ffffff" opacity="0.3" transform="rotate(-8 720 590)"/>
  </g>

  <!-- ruler next to the duck with a ? -->
  <g transform="translate(250,0)">
    <g stroke="#1b1430" stroke-width="22" stroke-linecap="round"><line x1="0" y1="170" x2="0" y2="840"/><line x1="-40" y1="170" x2="40" y2="170"/><line x1="-40" y1="840" x2="40" y2="840"/></g>
    <g stroke="#ffffff" stroke-width="12" stroke-linecap="round"><line x1="0" y1="170" x2="0" y2="840"/><line x1="-40" y1="170" x2="40" y2="170"/><line x1="-40" y1="840" x2="40" y2="840"/></g>
    <g stroke="#1b1430" stroke-width="5">
      <line x1="-14" y1="250" x2="14" y2="250"/><line x1="-14" y1="330" x2="14" y2="330"/><line x1="-14" y1="410" x2="14" y2="410"/><line x1="-14" y1="490" x2="14" y2="490"/><line x1="-14" y1="570" x2="14" y2="570"/><line x1="-14" y1="650" x2="14" y2="650"/><line x1="-14" y1="730" x2="14" y2="730"/>
    </g>
    <text x="-175" y="185" class="title" font-size="190" fill="#ffffff" stroke="#1b1430" stroke-width="22" paint-order="stroke" stroke-linejoin="round">?</text>
  </g>

  <!-- the noob, tiny -->
  <g transform="translate(1500,846)" filter="url(#drop)">
    <!-- legs -->
    <rect x="-34" y="-74" width="32" height="74" fill="#9bc23f" stroke="#1b1430" stroke-width="5"/>
    <rect x="2" y="-74" width="32" height="74" fill="#9bc23f" stroke="#1b1430" stroke-width="5"/>
    <!-- torso -->
    <rect x="-34" y="-148" width="68" height="76" fill="#1f6fd1" stroke="#1b1430" stroke-width="5"/>
    <!-- arms (scared, up) -->
    <rect x="-70" y="-190" width="32" height="74" fill="#ffd23a" stroke="#1b1430" stroke-width="5" transform="rotate(25 -54 -148)"/>
    <rect x="38" y="-190" width="32" height="74" fill="#ffd23a" stroke="#1b1430" stroke-width="5" transform="rotate(-25 54 -148)"/>
    <!-- head -->
    <rect x="-30" y="-206" width="60" height="58" rx="12" fill="#ffd23a" stroke="#1b1430" stroke-width="5"/>
    <ellipse cx="-11" cy="-182" rx="5" ry="8" fill="#1b1430"/><ellipse cx="11" cy="-182" rx="5" ry="8" fill="#1b1430"/>
    <ellipse cx="0" cy="-163" rx="8" ry="7" fill="#1b1430"/>
    <!-- sweat drop -->
    <path d="M36 -200 Q46 -184 36 -176 Q26 -184 36 -200 Z" fill="#7fd3ff" stroke="#1b1430" stroke-width="3"/>
  </g>
  <!-- small ruler for the noob -->
  <g transform="translate(1620,0)">
    <g stroke="#1b1430" stroke-width="16" stroke-linecap="round"><line x1="0" y1="640" x2="0" y2="846"/><line x1="-26" y1="640" x2="26" y2="640"/><line x1="-26" y1="846" x2="26" y2="846"/></g>
    <g stroke="#ffffff" stroke-width="8" stroke-linecap="round"><line x1="0" y1="640" x2="0" y2="846"/><line x1="-26" y1="640" x2="26" y2="640"/><line x1="-26" y1="846" x2="26" y2="846"/></g>
    <text x="40" y="668" class="lab" font-size="62" fill="#ffffff" stroke="#1b1430" stroke-width="14" paint-order="stroke" stroke-linejoin="round">1.8 m</text>
  </g>

  <!-- title -->
  <g transform="translate(960,150) rotate(-3)">
    <text text-anchor="middle" class="title" font-size="168" fill="url(#titleFill)" stroke="#3a1600" stroke-width="30" paint-order="stroke" stroke-linejoin="round" letter-spacing="4">HOW BIG IS IT?</text>
  </g>

  <!-- the guess slider -->
  <g transform="translate(960,975)">
    <rect x="-520" y="-48" width="1040" height="96" rx="48" fill="#1b1430" opacity="0.85"/>
    <rect x="-470" y="-14" width="940" height="28" rx="14" fill="url(#track)" stroke="#ffffff" stroke-width="5"/>
    <text x="-500" y="-62" class="lab" font-size="44" fill="#ffffff" stroke="#1b1430" stroke-width="10" paint-order="stroke">0.02x</text>
    <text x="500" y="-62" text-anchor="end" class="lab" font-size="44" fill="#ffffff" stroke="#1b1430" stroke-width="10" paint-order="stroke">50x</text>
    <g transform="translate(330,0)">
      <circle r="44" fill="#ffffff" stroke="#1b1430" stroke-width="8"/>
      <circle r="18" fill="#ff4d6d"/>
      <g transform="translate(0,-120)">
        <rect x="-110" y="-46" width="220" height="80" rx="22" fill="#ffffff" stroke="#1b1430" stroke-width="8"/>
        <path d="M-18 32 L0 58 L18 32 Z" fill="#ffffff" stroke="#1b1430" stroke-width="8" stroke-linejoin="round"/>
        <rect x="-26" y="26" width="52" height="12" fill="#ffffff"/>
        <text text-anchor="middle" y="16" class="title" font-size="60" fill="#ff4d6d">x40?</text>
      </g>
    </g>
  </g>
</svg>
</body></html>
